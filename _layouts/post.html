---
layout: default
---

<article class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>

    {% if page.date %}
      <p class="post-date">
        {{ page.date | date: "%B %-d, %Y" }}
      </p>
    {% endif %}

    {% if page.tags %}
      <p class="post-tags">
        {% for tag in page.tags %}
          <span class="post-tag">{{ tag }}</span>
        {% endfor %}
      </p>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

</article>
